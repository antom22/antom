/* ================= tiempo real ================= */
function listen(pid){return new Promise((resolve,reject)=>{let need=0,got=0;const first=()=>{if(++got===need)resolve()};
 const watch=(r,init,chg)=>{need++;let f=1;unsubs.push(onSnapshot(r,s=>{if(f){f=0;init(s);first()}else chg(s)},e=>{console.error(e);if(f){f=0;reject(e)}else toast('Se perdió la conexión: '+(e.message||e))}))};
 const who=s=>(s.data()||{}).updatedBy;
 watch(PR(pid),s=>{if(!s.exists()){reject(new Error('El proyecto no existe'));return}onProj(s,true)},s=>afterRemote(onProj(s,false),who(s)));
 if(!isExt()){
  watch(doc(db,'projects',pid,'private','finance'),s=>{onFin(s)},s=>afterRemote(onFin(s),who(s)));
  watch(collection(db,'projects',pid,'sections'),s=>s.forEach(d=>onSec(d,true)),s=>{let st=false,w;s.docChanges().forEach(c=>{if(c.type!=='removed'){st=onSec(c.doc,false)||st;w=who(c.doc)}});afterRemote(st,w)});
  watch(collection(db,'projects',pid,'pay'),s=>s.forEach(d=>onPay(d,true)),s=>{let st=false,w;s.docChanges().forEach(c=>{st=onPay(c.doc,false)||st;w=who(c.doc)});afterRemote(st,w)})
 }else{
  /* El externo escucha documento por documento: las reglas no le dejan leer los reservados */
  for(const s of D.secs)if(!RESTR_SECS.includes(s.id))watch(SEC(pid,s.id),d=>{if(d.exists())onSec(d,true)},d=>{if(d.exists())afterRemote(onSec(d,false),who(d))});
  for(const c of CATS())watch(PAY(pid,c.id),d=>{if(d.exists())onPay(d,true)},d=>{if(d.exists())afterRemote(onPay(d,false),who(d))})
 }})}
function onFin(s){FIN=s.exists()?s.data():{};applyFin();return false}
function onProj(s,init){if(!s.exists()){if(!init){toast('Este proyecto fue eliminado');home()}return false}const d=s.data(),pend=(Q['projects:'+s.id]||{}).patch||{},was=P&&P.useSica;
 loadP({id:s.id,name:d.name,data:{...d.data,...pend}});const nm=$('#nm');if(nm&&document.activeElement!==nm)nm.value=P.name;return!init&&was!==P.useSica}
function onSec(d,init){const sid=d.id,rows=d.data().rows||{};if(init||!RW[sid]){RW[sid]=Object.entries(rows).map(([i,r])=>({i,...r})).sort((a,b)=>a.pos-b.pos);return false}
 let st=false;const loc=RW[sid];for(const id in rows){const r=RM.get(id),pend=(Q['rows:'+id]||{}).patch||{};if(r)Object.assign(r,rows[id],pend);else{loc.push({i:id,...rows[id]});st=true}}
 const keep=loc.filter(r=>rows[r.i]);if(keep.length!==loc.length){RW[sid]=keep;st=true}if(st)RW[sid].sort((a,b)=>a.pos-b.pos);return st}
function onPay(d,init){const dep=d.id==='_'?'':d.id,items=d.data().items||{};
 if(init){for(const id in items)PG.push({id,...items[id],dep:items[id].dep??dep});return false}
 let st=false;for(const id in items){const p=PM.get(id),pend=(Q['payments:'+id]||{}).patch||{};if(p){const b=JSON.stringify([p.files,p.dep,p.r]);Object.assign(p,items[id],pend);if(b!==JSON.stringify([p.files,p.dep,p.r]))st=true}else{PG.push({id,...items[id],dep:items[id].dep??dep});st=true}}
 const keep=PG.filter(p=>p.dep!==dep||items[p.id]);if(keep.length!==PG.length){PG=keep;st=true}if(st)PG.sort((a,b)=>(b.at||0)-(a.at||0));return st}
function afterRemote(st,who){if(!P)return;reindex();calc();if(st)softRender();else{syncInputs();paint()}
 if(who&&who!==ME&&Date.now()-lastToast>15000){lastToast=Date.now();toast(who.split('@')[0]+' hizo cambios')}}

/* ================= eventos ================= */
async function movePay(p,to){await flush();const old=p.dep,id=p.id;p.dep=to;p.r='';const data=clean({...p});delete data.id;
 const b=writeBatch(db);b.set(PAY(P.id,to),{items:{[id]:data},...stamp()},{merge:true});b.update(PAY(P.id,old),{['items.'+id]:deleteField(),...stamp()});await b.commit();calc();pagRows()}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(t.type==='file'||!P)return;
 if(d.s){const r=RM.get(d.i);if(!r)return;let v;if(t.type==='number'){if(t.value==='')v=d.r?null:(d.f==='v'&&S(d.s).ty==='tec'?null:0);else v=+t.value}else v=t.value;
  const key=d.r?'r_'+d.f:d.f;r[key]=v;qpatch('rows',r.i,{[key]:v},{sid:d.s});ch()}
 else if(d.pg){const p=PM.get(d.pg);if(!p)return;const f=d.f;
  if(f==='dep'){movePay(p,t.value).catch(err=>toast('No se pudo mover: '+err.message));return}
  const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?null:+t.value):t.value;p[f]=v;qpatch('payments',p.id,{[f]:v},{dep:p.dep});ch()}
 else if(d.d){P.datos[d.d]=t.value;qpatch('projects',P.id,{['d_'+d.d]:t.value})}
 else if(d.n){P.notas[d.n]=t.value;qpatch('projects',P.id,{['n_'+d.n]:t.value})}
 else if(d.c){const v=t.value===''?null:+t.value;P.cierre[d.c]=v;qpatch('private','finance',{['c_'+d.c]:v});ch()}
 else if(d.pc){P.pct[d.pc]=+t.value;qpatch('private','finance',{['p_'+d.pc]:+t.value});ch()}
 else if(d.pf){F[d.pf]=t.value;pagRows()}
 else if(d.sx!=null){const r=P.sica[d.sx],j=+d.j;r[j]=+t.value;if(j<4){r[4]=r[2]+r[3];t.closest('tr').querySelector('[data-j="4"]').value=r[4]}qpatch('projects',P.id,{sica:JSON.stringify(P.sica)});ch()}
 else if(t.id==='us'){P.useSica=t.checked?1:0;qpatch('projects',P.id,{useSica:P.useSica});render()}
 else if(t.id==='fx'){P.fx=+t.value||1;qpatch('projects',P.id,{fx:P.fx});ch()}
 else if(t.id==='nm'){P.name=t.value;clearTimeout(nmT);const id=P.id,nm=t.value;nmT=setTimeout(()=>updateDoc(PR(id),{name:nm,...stamp()}).then(()=>setSt('✓ Guardado '+hora())).catch(()=>{}),600)}
 else if('iva'in d){P.ivaReal=t.checked?1:0;qpatch('projects',P.id,{ivaReal:P.ivaReal});ch()}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
 if(d.pgf){const p=PM.get(d.pgf);if(!p)return;setSt('Subiendo PDF…');for(const f of t.files){const n=p.id+'_'+Date.now()+'_'+f.name.replace(/[^\w.\-]+/g,'_');
   try{await uploadBytes(ref(stg,'facturas/'+P.id+'/'+n),f,{contentType:'application/pdf'});(p.files=p.files||[]).push({n,o:f.name})}catch(err){toast('No se pudo subir «'+f.name+'»: '+(err.message||err))}}
  qpatch('payments',p.id,{files:p.files||[]},{dep:p.dep});calc();pagRows();setSt('Guardando…')}
 else if(d.mr){try{await updateDoc(doc(db,'members',d.mr),{role:t.value});toast('Permiso actualizado')}catch(err){toast('No se pudo cambiar el permiso')}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,a,label'),d=t?.dataset||{};if(!t)return;
 try{
 if('lg'in d)await doLogin();
 else if('out'in d){await flush();await signOut(auth)}
 else if('new'in d){const n=prompt('Nombre del proyecto');if(!n)return;setSt('Creando…');const id=await createProject(n);tab='res';await openP(id)}
 else if(d.open){tab='res';await openP(d.open)}
 else if(d.dup){await dupP(d.dup);home();toast('Proyecto duplicado (sin pagos)')}
 else if(d.rm&&t.tagName==='BUTTON'){if(confirm('¿Borrar el proyecto para TODO el equipo? Incluye pagos y facturas. No se puede deshacer.')){await delP(d.rm);home()}}
 else if('team'in d)team();
 else if('go'in d){home()}
 else if(d.tab){tab=d.tab;F={q:'',st:''};render()}else if(d.cat){cat=d.cat;render()}else if(d.pdep){pdep=d.pdep;render()}
 else if(d.hide){const r=RM.get(d.hide),sid=Object.keys(RW).find(k=>RW[k].includes(r));if((V['e:'+d.hide]||V['a:'+d.hide])&&!confirm('Este rubro tiene valores cargados y SEGUIRÁ SUMANDO a los totales aunque lo ocultes. ¿Ocultarlo igual?'))return;r.hid=1;qpatch('rows',r.i,{hid:1},{sid});render()}
 else if(d.unhide){const r=RM.get(d.unhide),sid=Object.keys(RW).find(k=>RW[k].includes(r));r.hid=0;qpatch('rows',r.i,{hid:0},{sid});render()}
 else if(d.showh){SH[d.showh]=!SH[d.showh];render()}
 else if(d.add){const s=S(d.add),data=mkRow(s,s.ty==='tec'?['Otros','Nuevo cargo',null]:'Nuevo rubro');data.x=1;const id=uid(),pos=(RW[s.id].reduce((m,r)=>Math.max(m,r.pos),-1))+1;
  RW[s.id].push({i:id,pos,...data});reindex();ch();render();await updateDoc(SEC(P.id,s.id),{['rows.'+id]:clean({pos,...data}),...stamp()})}
 else if(d.del){if(!confirm('¿Borrar este rubro?'))return;const r=RM.get(d.del),sid=Object.keys(RW).find(k=>RW[k].includes(r));RW[sid]=RW[sid].filter(x=>x.i!==d.del);reindex();delete Q['rows:'+d.del];await updateDoc(SEC(P.id,sid),{['rows.'+d.del]:deleteField(),...stamp()});ch();render()}
 else if(d.clr){const r=RM.get(d.clr),sid=Object.keys(RW).find(k=>RW[k].includes(r)),patch={};for(const f of RF(S(sid))){r['r_'+f]=null;patch['r_'+f]=null}qpatch('rows',r.i,patch,{sid});ch();render()}
 else if(d.np){const id=uid(),data={dep:d.np,f:'C',m:'A',fecha:new Date().toISOString().slice(0,10),at:Date.now(),par:null};PG.unshift({id,...data});reindex();ch();pagRows();await setDoc(PAY(P.id,d.np),{items:{[id]:data},...stamp()},{merge:true})}
 else if(d.rp){if(confirm('¿Borrar este pago?')){const p=PM.get(d.rp);if(stg)for(const f of(p.files||[]))if(!f.link)deleteObject(ref(stg,'facturas/'+P.id+'/'+f.n)).catch(()=>{});PG=PG.filter(x=>x.id!==d.rp);reindex();delete Q['payments:'+d.rp];await updateDoc(PAY(P.id,p.dep),{['items.'+d.rp]:deleteField(),...stamp()});ch();pagRows()}}
 else if(d.of){const[pi,n]=d.of.split('|'),f=((PM.get(pi)||{}).files||[]).find(x=>x.n===n);if(!f)return;
  if(f.link){window.open(f.u,'_blank','noopener');return}const w=window.open('','_blank');try{const u=await getDownloadURL(ref(stg,'facturas/'+P.id+'/'+n));if(w)w.location=u;else toast('Tu navegador bloqueó la ventana; permití ventanas emergentes.')}catch(err){if(w)w.close();toast('No se pudo abrir el PDF')}}
 else if(d.lnk){const p=PM.get(d.lnk),u=prompt('Pegá el link del PDF (por ejemplo de Google Drive)');if(!u)return;if(!/^https?:\/\//i.test(u)){toast('El link tiene que empezar con https://');return}const o=prompt('Nombre para mostrar','Factura')||'Factura';(p.files=p.files||[]).push({n:'l'+uid(),o,u,link:1});qpatch('payments',p.id,{files:p.files},{dep:p.dep});ch();pagRows()}
 else if(d.rf){const[pi,n]=d.rf.split('|'),p=PM.get(pi),f=(p.files||[]).find(x=>x.n===n);if(confirm('¿Quitar esta factura?')){if(stg&&f&&!f.link)await deleteObject(ref(stg,'facturas/'+P.id+'/'+n)).catch(()=>{});p.files=p.files.filter(x=>x.n!==n);qpatch('payments',p.id,{files:p.files},{dep:p.dep});ch();pagRows()}}
 else if('csv'in d){const c=[['Departamento','Fecha','Rubro','Rol','Proveedor','Descripción','CBU','Banco','Cuenta','Forma','Moneda','Parcial','IVA','Total','Abonado','Facturas']],{L}=idx(),dn=id=>(D.cats.find(x=>x.id===id)||{}).n||'';
  PG.forEach(p=>c.push([dn(p.dep),p.fecha,L[p.r],p.rol,p.nom,p.des,p.cbu,p.banco,p.cta,p.f,p.m==='U'?'USD':'ARS',p.par,V['pi:'+p.id],V['pt:'+p.id],p.ab?'Sí':'No',(p.files||[]).map(f=>f.o+(f.u?' '+f.u:'')).join(' | ')]));dl('pagos_'+P.name+'.csv','﻿'+c.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}
 else if('bk'in d)dl(P.name+'_respaldo.json',JSON.stringify({project:P,rows:RW,payments:PG},null,1),'application/json');
 else if('sg'in d){await setDoc(doc(db,'settings','sica'),{value:JSON.stringify(P.sica),...stamp()});toast('SICA vigente guardada para los próximos proyectos')}
 else if('sl'in d){const s=await getSica();if(!s)toast('Todavía no hay SICA vigente guardada');else if(confirm('¿Reemplazar la SICA de este proyecto por la vigente?')){P.sica=s;qpatch('projects',P.id,{sica:JSON.stringify(s)});ch();render()}}
 else if('madd'in d){const email=$('#tm').value.trim().toLowerCase();if(!email)return;await setDoc(doc(db,'members',email),{email,name:$('#tn').value.trim(),role:$('#tr').value});team()}
 else if(d.mrm){if(confirm('¿Quitar el acceso de '+d.mrm+'?')){await deleteDoc(doc(db,'members',d.mrm));team()}}
 }catch(err){console.error(err);toast('Error: '+(err.message||err));setSt('')}});
const dl=(n,c,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m}));a.download=n.replace(/[\\/:*?"<>|]/g,'_');a.click()};
boot();
